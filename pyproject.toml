[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisgap"
version = "0.1.0"
description = "Getting the tennis player's career from tennisabstract.com and plot the age gap vs. opponents"
requires-python = ">=3.9"
dependencies = ["requests", "pandas", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
